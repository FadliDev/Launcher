name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Decode signing keystore
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sally-release.jks"
          test -s "$RUNNER_TEMP/sally-release.jks"

      - name: Sign release APK
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/sally-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/sally-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out SallyLauncher-release.apk \
            "$RUNNER_TEMP/sally-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose SallyLauncher-release.apk

      - name: Prepare unsigned APK for release if signing secrets are absent
        if: ${{ env.SIGNING_CONFIGURED != 'true' }}
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk SallyLauncher-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SallyLauncher-release-${{ github.ref_name }}
          path: |
            SallyLauncher-release.apk
            SallyLauncher-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f SallyLauncher-release.apk ]; then
            gh release create "$GITHUB_REF_NAME" SallyLauncher-release.apk --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" SallyLauncher-release-unsigned.apk --generate-notes --title "$GITHUB_REF_NAME (unsigned APK)"
          fi
