name: Build Ember

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: 25.2.9519653
  # Krypton Wrapper = NG-GL4ES. Override with a repo variable if you use a fork.
  KRYPTON_REPO: ${{ vars.KRYPTON_REPO || 'https://github.com/BZLZHH/NG-GL4ES.git' }}
  KRYPTON_REF: ${{ vars.KRYPTON_REF || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) + sdkmanager, so no setup-android action
      - name: Install NDK + CMake + platform
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # ---- Krypton Wrapper (default renderer) -------------------------------------------
      # If third_party/libng_gl4es.so exists in the repo it is used as-is (skips the build).
      - name: Build Krypton Wrapper (libng_gl4es.so)
        id: krypton
        continue-on-error: true
        run: |
          set -e
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          if [ -f third_party/libng_gl4es.so ]; then
            cp third_party/libng_gl4es.so "$OUT/libng_gl4es.so"; echo "Using prebuilt third_party/libng_gl4es.so"; exit 0
          fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          git clone --depth 1 ${KRYPTON_REF:+--branch "$KRYPTON_REF"} "$KRYPTON_REPO" /tmp/krypton
          cd /tmp/krypton
          if [ -f CMakeLists.txt ]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
              -DNOX11=ON -DNOEGL=OFF
            cmake --build build -j"$(nproc)"
            SO=$(find build -name '*.so' -size +100k | head -n1)
          elif [ -f Android.mk ] || [ -d jni ]; then
            "$ANDROID_NDK_HOME/ndk-build" -j"$(nproc)" APP_ABI=arm64-v8a APP_PLATFORM=android-26 NDK_PROJECT_PATH=. \
              $( [ -f Android.mk ] && echo APP_BUILD_SCRIPT=Android.mk )
            SO=$(find libs obj -path '*arm64-v8a*' -name '*.so' -size +100k | head -n1)
          else
            echo "Unknown build system in $KRYPTON_REPO"; exit 1
          fi
          test -n "$SO" || { echo "No .so produced"; exit 1; }
          cp "$SO" "$GITHUB_WORKSPACE/$OUT/libng_gl4es.so"
          echo "Krypton built from: $SO"

      - name: Warn if Krypton is missing
        if: steps.krypton.outcome == 'failure'
        run: echo "::warning title=Krypton Wrapper::libng_gl4es.so was NOT built; the APK will fall back to GL4ES. Put a prebuilt lib in third_party/libng_gl4es.so or set KRYPTON_REPO."

      # ---- App ---------------------------------------------------------------------------
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK contents (renderers)
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep -E 'libng_gl4es|libgl4es_114|libpojavexec|libexithook|jre-' || true

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
