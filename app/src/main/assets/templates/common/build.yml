# managed by ModForge
name: Build
on:
  push:
    branches: [{{branch}}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '{{java}}'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '{{gradle}}'
      - run: {{buildCommand}}
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
